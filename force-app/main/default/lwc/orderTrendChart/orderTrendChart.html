<template>
    <lightning-card title="Month-wise Orders Count" class="order-card">
        <div class="filter-box">
     <lightning-combobox
    label="Select Year"
    value={selectedYear}
    options={yearOptions}
    onchange={handleYearChange}>
</lightning-combobox>
    </div>

        <div class="chart-container">
            <canvas data-id="trendChart"></canvas>
        </div>
    </lightning-card>
</template>
