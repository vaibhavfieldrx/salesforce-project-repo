<template>
    <div class="pages">

         <div class="header">
            <div>
                <h1 class="title">Order Management</h1>
                <p class="desc">Create and manage customer orders</p>
            </div>
              <button class="primary" onclick={openOrderModal}>
    View Order
</button>
        </div>
<div class="card">

<c-customer-selector
    selected-customer-id={customerId}
   disabled={isEditMode}
    oncustomerselect={handleCustomer}>
</c-customer-selector>

        <template if:true={customerId}>
            <c-customer-info customer-id={customerId}></c-customer-info>
          <c-order-address-and-warehouse order-data={orderAddressData} onaddresschange={handleAddressChange}></c-order-address-and-warehouse>

          <c-product-selector
           show-otp-modal={showOtpModal}
    onproductsselected={handleProductsSelected}
        onverifyotp={handleVerifyOtp}
    oncloseotp={handleCloseOtp}
    >
</c-product-selector>

       <div class="slds-grid slds-align_absolute-center slds-m-top_medium">

    <!-- PAYMENT STATUS -->
    <div class="slds-col slds-size_1-of-2">
        <label class="slds-form-element__label">Payment Status</label>
        <select
            class="slds-select"
            value={paymentStatus}
            onchange={handlePaymentStatusChange}>
            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
        </select>
    </div>

    <!-- OTP CHECKBOX -->
    <div class="slds-col slds-size_1-of-2 slds-m-top_large">
        <lightning-input
            type="checkbox"
            label="OTP Verification Required"
            checked={otpRequired}
            onchange={handleOtpRequiredChange}>
        </lightning-input>
    </div>

</div>

        <!-- Create Order Button -->
      <div class="create-order-wrapper">
 <lightning-button
    label={orderButtonLabel}
    variant="brand"
    class="full-width-btn"
    onclick={handleCreateOrEditOrder}>
</lightning-button>
</div>



        </template>
     
</div>
        

   <div class="order-history" if:true={customerId}>
             <div class="header">
            <div>
                <h1 class="title">Order History</h1>
                <p class="desc">Customer orders history</p>
            </div>
             
        </div>

    <template if:true={hasOrders}>
        <div class="order-list">
            <template for:each={orders} for:item="order">
                <div key={order.Id} class="order-card">
                    <div class="order-header">
                        <div>
                            <h3>{order.OrderNumber}</h3>
                            <div class="inner-class">
                                <span class={order.statusClass}>{order.Status}</span>
                                <span class="date-inner">
                                    <lightning-icon icon-name="utility:event" size="xx-small"></lightning-icon>
                                    <lightning-formatted-date-time
                                        value={order.CreatedDate}
                                        day="2-digit"
                                        month="short"
                                        year="numeric">
                                    </lightning-formatted-date-time>
                                </span>
                            </div>
                        </div>
                        <div class="amount">
                            ₹ {order.TotalAmount}
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Pagination -->
            <div class="pagination">
    <button class="page-btn" onclick={handlePrev} disabled={isFirstPage}>
        ‹ Prev
    </button>
    <div class="page-info">
        <span class="page-number">{pageNumber}</span>
        <span class="page-separator">/</span>
        <span class="page-total">{totalPages}</span>
    </div>
    <button class="page-btn primary" onclick={handleNext} disabled={isLastPage}>
        Next ›
    </button>
</div>
    </template>

    <template if:false={hasOrders}>
        <div class="empty">
            <lightning-icon icon-name="utility:inbox" size="large"></lightning-icon>
            <h2>No Orders Found</h2>
            <p>This customer doesn’t have any previous orders yet.</p>
        </div>
    </template>
</div>

    </div>

<template if:true={showOtpModal}>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <!-- HEADER -->
            <header class="slds-modal__header slds-text-align_center">
                <lightning-icon
                    icon-name="utility:lock"
                    size="small"
                    class="slds-m-bottom_small">
                </lightning-icon>
                <h2 class="slds-text-heading_medium">
                    OTP Verification
                </h2>
                <p class="slds-text-body_small slds-m-top_x-small">
                    Enter the 6-digit OTP sent to the customer
                </p>
            </header>

            <!-- CONTENT -->
            <div class="slds-modal__content slds-p-around_large">
                <lightning-input
                    type="number"
                    label="One Time Password"
                    placeholder="Enter OTP"
                    maxlength="6"
                    class="slds-m-bottom_medium"
                    onchange={handleOtpChange}>
                </lightning-input>
            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    class="slds-m-right_small"
                    onclick={handleCloseOtp}>
                </lightning-button>

                <lightning-button
                    label="Verify OTP"
                    variant="brand"
                    onclick={handleVerifyOtp}>
                </lightning-button>
            </footer>

        </div>
    </section>

    <!-- BACKDROP -->
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

    
</template>
