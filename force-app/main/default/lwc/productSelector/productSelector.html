<template>
    <div class="card">

        <!-- HEADER -->
        <div class="header slds-grid slds-grid_align-spread slds-p-bottom_small">
            <div>
                <h2 class="section-title">Add Products</h2>
                <p class="subtitle">Select products and define quantity</p>
            </div>

            <lightning-button
                label="Add Products"
                variant="brand"
                onclick={openProductModal}>
            </lightning-button>
        </div>

        <!-- ORDER ITEMS -->
        <template if:true={selectedProducts.length}>
            <div class="order-card">
                <h3 class="order-title">Order Items</h3>

                <template for:each={selectedProducts} for:item="p">
                    <div key={p.id} class="order-row">
                        <div class="order-info">
                            <div class="order-name">{p.name}</div>

                            <div class="order-meta">
                                Qty:
                                <input
                                    type="number"
                                    min="1"
                                    value={p.qty}
                                    data-id={p.id}
                                    onchange={handleQtyChange}
                                    class="styled-input"
                                />
                                <span> × ₹{p.price}</span>
                            </div>
                        </div>

                        <div class="order-right">
                            <div class="order-price">₹{p.subtotal}</div>
                            <lightning-button-icon
                                icon-name="utility:close"
                                variant="bare"
                                data-id={p.id}
                                onclick={handleRemoveItem}>
                            </lightning-button-icon>
                        </div>
                    </div>
                </template>

                <!-- TOTAL DISCOUNT -->
                <div class="order-total">
                    <span>Discount</span>
                    <input
                        type="number"
                        min="0"
                        value={totalDiscount}
                        onchange={handleTotalDiscountChange}
                        class="styled-input"
                    />
                </div>

                <!-- FINAL TOTAL -->
                <div class="order-total">
                    <span>Total</span>
                    <span class="total-amount">₹{finalAmount}</span>
                </div>
            </div>
        </template>

       
    </div>

    <!-- PRODUCT MODAL -->
    <template if:true={showProductModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container slds-modal_large">
                <header class="slds-modal__header">
                    <h2>Select Products</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-datatable
                        key-field="id"
                        data={products}
                        columns={columns}
                        selected-rows={selectedRowIds}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                    <div class="pagination">
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            onclick={handlePrev}
                            disabled={isFirstPage}>
                        </lightning-button-icon>

                        <span>Page {currentPage} of {totalPages}</span>

                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            onclick={handleNext}
                            disabled={isLastPage}>
                        </lightning-button-icon>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeProductModal}></lightning-button>
                    <lightning-button label="Done" variant="brand" onclick={closeProductModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
</template>
