<template>
     <div class="page">
        <div class="page-header">
            <div>
                <h1 class="page-title">Attendance Management</h1>
                <p class="desc">Track attendance records</p>
            </div>
        </div>
        <!-- Summary Cards -->
              <div class="summary-container">
           
            <div class="summary-card">
                <div class="icon green">
                    <lightning-icon icon-name="utility:user" size="small"></lightning-icon>
                </div>
                <div>
                    <p class="label">Present</p>
                    <h2 class="green-text">{presentCount}</h2>
                </div>
            </div>
            <div class="summary-card">
                <div class="icon red">
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                </div>
                <div>
                    <p class="label">Absent</p>
                    <h2 class="red-text">{absentCount}</h2>
                </div>
            </div>
           
        </div>
<div class="attendance-container">
       <!-- Filters -->
<div class="filters">
    <lightning-combobox
        class="status-filter"
        value={selectedStatus}
        options={statusOptions}
        onchange={handleStatusChange}>
    </lightning-combobox>
</div>
        <!-- Table -->
        <table class="attendance-table">
            <thead>
                <tr>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={attendanceList} for:item="rec">
                    <tr key={rec.id}>
                        <!-- <td class="employee-cell">
                            <div class="avatar">{rec.initial}</div>
                            {rec.name}
                        </td> -->
                        <td>{rec.checkIn}</td>
                        <td>{rec.checkOut}</td>
                        <td>
                            <span class={rec.statusClass}>{rec.status}</span>
                        </td>
                    </tr>
                </template>
                <template if:false={attendanceList.length}>
                    <tr>
                        <td colspan="6" class="empty">No records found</td>
                    </tr>
                </template>
            </tbody>
        </table>
        <!-- Pagination -->
       <div class="pagination">
    <button class="page-btn" onclick={prevPage} disabled={isFirstPage}>
        ‹ Prev
    </button>
    <div class="page-info">
        <span class="page-number">{currentPage}</span>
        <span class="page-separator">/</span>
        <span class="page-total">{totalPages}</span>
    </div>
    <button class="page-btn primary" onclick={nextPage} disabled={isLastPage}>
        Next ›
    </button>
</div>
    </div>
     </div>
</template>
