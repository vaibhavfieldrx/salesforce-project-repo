<template>
    <div class="slds-grid slds-wrap">
        <div
            class="
                slds-col
                slds-size_1-of-1
                slds-medium-size_1-of-2
                slds-large-size_1-of-2
            "
        >
            <h2 class="card-title">Select Customer</h2>

            <lightning-combobox
                label="Customer"
                placeholder="Choose a customer..."
                options={options}
                value={selectedCustomerId}
                disabled={disabled}
                onchange={handleChange}>
            </lightning-combobox>
        </div>
    </div>
</template>
