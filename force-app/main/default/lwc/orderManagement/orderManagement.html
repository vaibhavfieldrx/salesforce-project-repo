<template>
    <div class="page">

        <!-- HEADER -->
        <div class="header">
            <div>
                <h1 class="title">Order Management</h1>
                <p class="desc">Create and manage customer orders</p>
            </div>
            <button class="primary" onclick={openNewOrderModal}>
                + New Order
            </button>
        </div>

        <div class="content">

            <!-- TABLE CARD -->
            <div class="card table-card">

                <!-- FILTER BAR -->
                <div class="filter-bar">
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        placeholder="Search Orders"
                        value={searchKey}
                        class="search-input"
                        onchange={handleSearch}>
                    </lightning-input>

                    <lightning-combobox
                        label="Status"
                        variant="label-hidden"
                        value={selectedStatus}
                        options={statusOptions}
                        class="status-filter"
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>

                <!-- TABLE -->
                <table>
                    <thead>
                        <tr>
                            <th>Order Number</th>
                            <th>Customer Name</th>
                            <th>Order Amount</th>
                            <th>Order Created Date</th>
                            <th>Status</th>
                            <th class="right">Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={orders} for:item="o">
                            <tr key={o.id}>
                                <td>#{o.number}</td>
                                <td>{o.customer}</td>
                                <td>₹{o.amount}</td>
                                <td>{o.date}</td>
                                <td>
                                    <span class={o.statusClass}>{o.status}</span>
                                </td>
                                <td class="right">
                                    <lightning-button-menu
                                        alternative-text="Actions"
                                        onselect={handleAction}>

                                        <lightning-menu-item
                                            label="View"
                                            value={o.view}>
                                        </lightning-menu-item>

                                        <template if:true={o.isDraft}>
            <lightning-menu-item
                label="Edit"
                value={o.edit}>
            </lightning-menu-item>

            <lightning-menu-item
                label="Delete"
                value={o.delete}>
            </lightning-menu-item>
        </template>
                                    </lightning-button-menu>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <!-- PAGINATION -->
                <div class="pagination">
                    <button class="page-btn" onclick={prevPage} disabled={isFirstPage}>
                        ‹ Prev
                    </button>

                    <div class="page-info">
                        <span class="page-number">{currentPage}</span>
                        <span>/</span>
                        <span class="page-total">{totalPages}</span>
                    </div>

                    <button class="page-btn primary" onclick={nextPage} disabled={isLastPage}>
                        Next ›
                    </button>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="side">
                <div class="card">
                    <h3 class="title-3">Order Summary</h3>

                    <template for:each={summaryList} for:item="s">
                        <div key={s.label} class="summary-row">
                            <div class="under-icon">
                                <div class={s.wrapperClass}>
                                    <lightning-icon
                                        icon-name={s.iconName}
                                        size="x-small">
                                    </lightning-icon>
                                </div>
                                <span class="label">{s.label}</span>
                            </div>
                            <b>{s.count}</b>
                        </div>
                    </template>
                </div>

               <template if:true={showApprovalInbox}>
    <div class="card slds-m-top_medium">
        <h3 class="title-3">Pending Approvals</h3>
        <c-approval-inbox></c-approval-inbox>
    </div>
</template>
                <div class="card revenue">
                    <p class="title-3">Total Revenue</p>
                    <h2 class="amount">₹{revenue}</h2>
                </div>
            </div>

        </div>
    </div>
</template>
